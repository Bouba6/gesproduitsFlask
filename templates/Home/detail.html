{% extends "shared/layout.html" %}

{% block content %}
<div class="container mx-auto p-6 mt-8 bg-white  rounded-lg max-w-5xl">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Détails du produit</h1>

    <div class="flex flex-col md:flex-row gap-6 items-center">
        <!-- Image -->
        <div class="w-full md:w-1/2">
            <img src="{{ url_for('static', filename='images/' ~ product.image) }}" alt="Image du produit"
                class="w-full h-72 object-cover rounded-lg shadow">
        </div>

        <!-- Info -->
        <div class="w-full md:w-1/2 space-y-4">
            <h2 class="text-2xl font-semibold text-gray-700">{{ product.name }}</h2>
            <p class="text-gray-600 text-base">{{ product.description }}</p>
            <p class="text-xl font-bold text-blue-600">{{ product.price }} </p>

            <div class="flex gap-4 pt-4">
                <a href="{{ url_for('edit', id=product.id) }}"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded shadow transition">
                    Modifier
                </a>
                <a href="{{ url_for('delete', id=product.id) }}"
                    class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded shadow transition">
                    Supprimer
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
