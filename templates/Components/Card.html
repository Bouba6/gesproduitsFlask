<!-- Creons une card -->

<div class="form-product bg-white shadow-lg hover:shadow-xl transition-all duration-300 rounded-lg overflow-hidden">
    <div class="relative aspect-[3/4] w-full overflow-hidden">
        <img src="{{ url_for('static', filename='images/' ~ product.image) }}" alt="@product.Libelle"
            class="w-full h-full object-cover hover:scale-105 transition-transform duration-500 ease-out" />

        <!-- Badge Nouveau avec design amélioré -->
        <div class="absolute top-3 left-3 bg-darkinti text-white text-xs px-3 py-1.5 rounded-full font-semibold">
            NEW
        </div>
    </div>

    <!-- Content Container avec padding ajusté -->
    <div class="p-5 space-y-3">
        <div class="flex items-center justify-between">
            <p class="text-xs text-gray-500 uppercase tracking-wider font-medium">Category</p>
            <!-- Étoiles -->
            <div class="flex items-center space-x-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-yellow-400" viewBox="0 0 20 20"
                    fill="currentColor">
                    <path
                        d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                </svg>
                <span class="text-sm text-gray-600 font-medium">4.5</span>
            </div>
        </div>

        <h3 class="text-xl hover:text-darkinti font-medium text-gray-900 line-clamp-2">
            {{product.Libelle}}
        </h3>

        <div class="flex items-center space-x-2">
            <span class="text-lg font-semibold text-darkinti">
                {{product.price}}
            </span>
        </div>

        <div class="flex items-center">
            <div>
                <a href="{{url_for('product', id=product.id)}}"
                    class="bg-blue-900 text-white px-4 py-2 rounded-lg hover:bg-darkinti/90 transition duration-200">
                    Voir le produit
                </a>
            </div>
        </div>
    </div>

</div>
